<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>UPVT - Junio Interactivo</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <a-scene embedded arjs>
        
        <a-marker type="pattern" url="url_a_tu_patron_del_poster.patt">

            <a-sphere position="1.5 0.5 0.5" radius="0.3" color="#FFD700" 
                      animation="property: position; to: 1.5 0.6 0.5; dir: alternate; dur: 1000; loop: true"></a-sphere>

            <a-circle position="-1.2 0.8 0.1" radius="0.15" color="#4CAF50" class="interactivo" 
                      event-set__click="_target: #info Medio Ambiente; visible: true">
                <a-text value="INFO" align="center" width="2" position="0 0 0.01"></a-text>
            </a-circle>

            <a-circle position="-1.2 0.3 0.1" radius="0.15" color="#FFC107" class="interactivo"
                      event-set__click="_target: #info Dia del Padre; visible: true">
                <a-text value="INFO" align="center" width="2" position="0 0 0.01"></a-text>
            </a-circle>

            <a-entity id="info Medio Ambiente" position="0 1 0" visible="false">
                <a-plane width="3" height="1" color="#f1f1f1" position="0 0 0"></a-plane>
                <a-text value="Cuidemos nuestro planeta. Más info en: eco-upvt.com" color="black" align="center" position="0 0 0.01"></a-text>
            </a-entity>

            <a-entity id="info Dia del Padre" position="0 1 0" visible="false">
                <a-plane width="3" height="1" color="#f1f1f1" position="0 0 0"></a-plane>
                <a-text value="Feliz Día del Padre a todos los papás universitarios!" color="black" align="center" position="0 0 0.01"></a-text>
            </a-entity>

        </a-marker>
        
        <a-entity camera>
            <a-cursor fuse="true" fuse-timeout="2000" raycaster="objects: .interactivo"></a-cursor>
        </a-entity>
        
    </a-scene>

</body>
</html>
