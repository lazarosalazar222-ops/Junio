<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>UPVT - Junio Interactivo</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <a-scene embedded arjs>
        <a-marker preset="hiro">

            <a-sphere position="0 0.5 0" radius="0.3" color="#FFD700" 
                      animation="property: position; to: 0 0.7 0; dir: alternate; dur: 1000; loop: true"></a-sphere>

            <a-entity text="value: INTERACTIVO UPVT; align: center; width: 4" position="0 1.2 0" rotation="-90 0 0"></a-entity>

        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
